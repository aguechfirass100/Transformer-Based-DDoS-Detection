data:
#  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/notebooks/processed_dataset_ready_for_transformer.parquet"
  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/notebooks/data_20k.parquet"
  label_column: "Label"
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

model:
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  ffn_dim: 1024
  dropout: 0.25
  num_classes: 12

training:
  batch_size: 64
  learning_rate: 5e-5
  epochs: 40
  gpus: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4

early_stopping:
  monitor: val_f1
  patience: 8
  mode: max
  min_delta: 0.001

scheduler:
  type: "cosine_warm_restarts"
  T_0: 10
  T_mult: 2
  eta_min_factor: 0.01

augmentation:
  noise_factor: 0.02
  feature_dropout: 0.1
  mixup_alpha: 0.2

output_dir: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/models/model_multi_attention/lightning_logs"


feature_groups:
  temporal:
    - "FlowDuration"
    - "FlowIATStd"
    - "FwdIATMax"
    - "FlowIATMin"
    - "BwdIATStd"
    - "BwdIATMax"
    - "ActiveMean"
    - "ActiveMin"
    - "IdleMean"
    - "IdleMin"

  spatial:
    - "SourceIP"
    - "SourcePort"
    - "DestinationIP"
    - "DestinationPort"
    - "Down/UpRatio"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"
    - "SubflowFwdPackets"
    - "SubflowBwdPackets"
    - "SubflowBwdBytes"

  protocol:
    - "Protocol"
    - "ACKFlagCount"
    - "FwdPSHFlags"
    - "RSTFlagCount"
    - "FwdURGFlags"
    - "BwdURGFlags"
    - "FwdHeaderLength"
    - "BwdHeaderLength"
    - "min_seg_size_forward"
    - "FlowPackets/s"

  statistical:
    - "TotalBackwardPackets"
    - "TotalLengthofBwdPackets"
    - "FwdPacketLengthMean"
    - "FwdPacketLengthStd"
    - "BwdPacketLengthMean"
    - "BwdPacketLengthStd"
    - "PacketLengthVariance"
    - "AveragePacketSize"
    - "FlowBytes/s"
    - "FwdAvgBytes/Bulk"




