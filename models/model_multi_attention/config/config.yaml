data:
#  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/notebooks/processed_dataset_ready_for_transformer.parquet"
#  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/notebooks/data_20k.parquet"
#  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/models/model_main/data/original_data/finale_12_classes/pruned/final_clean_data_2.pkl"
  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/notebooks/IFT_data_ordered.parquet"
  label_column: "Label"
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

model:
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  ffn_dim: 1024
  dropout: 0.25
  num_classes: 12

training:
  batch_size: 64
  learning_rate: 5e-5
  epochs: 40
  gpus: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4

early_stopping:
  monitor: val_f1
  patience: 8
  mode: max
  min_delta: 0.001

scheduler:
  type: "cosine_warm_restarts"
  T_0: 10
  T_mult: 2
  eta_min_factor: 0.01

augmentation:
  noise_factor: 0.02
  feature_dropout: 0.1
  mixup_alpha: 0.2

output_dir: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/models/model_multi_attention/lightning_logs"


feature_groups:
  temporal:
    - "Timestamp"
    - "Flow IAT Min"
    - "Fwd IAT Mean"
    - "Fwd IAT Max"
    - "Flow IAT Max"
    - "Flow IAT Mean"
    - "Fwd IAT Total"
    - "Flow Duration"

  spatial:
    - "Source IP"
    - "Destination IP"
    - "Destination Port"

  protocol:
    - "Protocol"
    - "ACK Flag Count"

  statistical:
    - "Max Packet Length"
    - "Fwd Packets/s"
    - "Fwd Packet Length Std"
    - "Subflow Fwd Bytes"
    - "min_seg_size_forward"
    - "Packet Length Std"
    - "Total Length of Fwd Packets"
    - "Fwd Packet Length Max"
    - "Init_Win_bytes_forward"
    - "Fwd Header Length"
    - "Fwd Packet Length Min"
    - "Average Packet Size"
    - "Min Packet Length"


advanced_training:
  use_swa: true          # Stochastic Weight Averaging
  swa_start_epoch: 30
  find_lr: true          # Learning rate finder
  precision: 16          # Mixed precision training

# Model ensemble settings (for inference)
ensemble:
  enabled: false
  num_models: 3
  voting: "soft"

seed: 42