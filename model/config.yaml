data:
  data_file: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/data/subset/01-12/flow-level/combined_subset.parquet"
  label_column: "Label"
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

model:
  embed_dim: 128                    # Bigger embedding space for better representation
  num_heads: 8                      # More heads for capturing diverse attention patterns
  num_layers: 4                     # Slightly deeper transformer
  ffn_dim: 256                      # Larger feedforward network
  dropout: 0.3                      # Increased dropout to reduce overfitting
  num_classes: 12

training:
  batch_size: 128                   # Larger batch size for better gradient estimates
  learning_rate: 1e-4               # Higher LR for faster convergence (adjustable)
  epochs: 30                        # Give the model more time to learn
  gpus: 1                           # Use GPU if available


early_stopping:
  monitor: val_loss
  patience: 5
  mode: min

output_dir: "C:/Users/AGFirass/Documents/GitHub/Transformer-Based-DDoS-Detection/model/lightning_logs"
